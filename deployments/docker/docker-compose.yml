name: gokzincir

services:
  # Portlar bilincli olarak kaydirildi (4224/8224 ve asagida postgres 5434):
  # GOKTURK 4222/8222/5432, GOKKALKAN 4222/8222/5433 kullaniyor. Ucunun ayni
  # makinede ayni anda ayaga kalkabilmesi icin GOKZINCIR kendi portlarini
  # kullanir. Konteyner ici port (4222) degismez, yalnizca host eslemesi.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4224:4222"
      - "8224:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gokzincir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gokzincir}
      POSTGRES_DB: ${POSTGRES_DB:-gokzincir}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gokzincir}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # GZ0-1 iskeleti: sadece boot + /healthz. NHI envanteri/graph/blast-radius
  # (GZ-A, GZ-B, GZ-C) geldikce bu servis onlarin uzerine oturacak; simdilik
  # yalnizca altyapinin (nats+postgres) uzerine saglikli bir bos binary
  # ayaga kalkiyor.
  gokzincir:
    build:
      context: ../../
      dockerfile: deployments/docker/gokzincir.Dockerfile
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-gokzincir}:${POSTGRES_PASSWORD:-gokzincir}@postgres:5432/${POSTGRES_DB:-gokzincir}?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: ":8100"
    ports:
      - "8100:8100"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/gokzincir", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
