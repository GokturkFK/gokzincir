name: gokzincir

services:
  # Portlar bilincli olarak kaydirildi (4224/8224 ve asagida postgres 5434):
  # GOKTURK 4222/8222/5432, GOKKALKAN 4222/8222/5433 kullaniyor. Ucunun ayni
  # makinede ayni anda ayaga kalkabilmesi icin GOKZINCIR kendi portlarini
  # kullanir. Konteyner ici port (4222) degismez, yalnizca host eslemesi.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4224:4222"
      - "8224:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gokzincir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gokzincir}
      POSTGRES_DB: ${POSTGRES_DB:-gokzincir}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gokzincir}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tek seferlik: semayi uygular ve cikar. Uygulama bunun BASARIYLA
  # bitmesini bekler (service_completed_successfully) — yoksa gokzincir
  # semasiz bir DB'ye baglanip her sorguda patlardi.
  migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gokzincir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gokzincir}
      POSTGRES_DB: ${POSTGRES_DB:-gokzincir}
    volumes:
      - ../../migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # NHI envanteri, graph/blast-radius, tuzak ekimi ve korelasyon tek
  # binary'de (bkz. cmd/gokzincir).
  gokzincir:
    build:
      context: ../../
      dockerfile: deployments/docker/gokzincir.Dockerfile
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-gokzincir}:${POSTGRES_PASSWORD:-gokzincir}@postgres:5432/${POSTGRES_DB:-gokzincir}?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: ":8100"
      # Ekilecek sahte NHI sayisi (bkz. internal/seed). Ekim ilk envanter
      # turundan SONRA olur — tuzak benzeyecegi kayitlarin dagilimindan
      # uretilir. 0 = ekim kapali.
      DECOY_COUNT: ${DECOY_COUNT:-1}
    ports:
      - "8100:8100"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/gokzincir", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
